name: Afbeeldingen ophalen
# Zet regels "bestandsnaam url" in img/_fetch.txt en push. Deze workflow downloadt ze naar /img,
# verwijdert _fetch.txt en commit het resultaat. Cloudflare publiceert daarna vanzelf.
on:
  push:
    paths: ['img/_fetch.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ -f img/_fetch.txt ] || exit 0
          while read -r name url; do
            [ -z "$name" ] && continue
            echo "↓ $name"; curl -sSfL "$url" -o "img/$name" || curl -sSfL "${url/maxresdefault/hqdefault}" -o "img/$name" || echo "  overgeslagen: $name"
          done < img/_fetch.txt
          git rm -q img/_fetch.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add img
          git commit -m "Afbeeldingen opgehaald" && git push
